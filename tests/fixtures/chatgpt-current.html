<!doctype html>
<html>
  <body>
    <div data-app-shell-active-page="false">
      <main>
        <div data-message-author-role="user">Prompt from an inactive chat</div>
      </main>
    </div>
    <div data-app-shell-active-page="true">
      <main>
        <div data-thread-find-target="conversation">
          <div data-turn-key="message-1">
            <div data-content-search-turn-key="fallback-turn-0">
              <div class="block-BQZwFn">
                <h4 class="sr-only m-0 select-none">You said:</h4>
                <div class="group/user-message flex flex-col items-end gap-2"
                     data-chatgpt-search-unit-key="fallback-turn-0:0:user"
                     data-chatgpt-search-message-ids="message-1">
                  <div class="w-full" data-content-search-unit-key="fallback-turn-0:0:user">
                    <div class="group/user-message flex w-full flex-col gap-1 items-end">
                      <div data-user-message-bubble="true">
                        <div class="flex flex-col items-end gap-1">
                          <div class="relative w-full min-w-0 text-size-chat leading-relaxed">hello</div>
                        </div>
                      </div>
                      <div class="flex flex-row-reverse items-center gap-1">
                        <button>Copy message</button>
                        <button>Edit message</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="block-BQZwFn">
                <h4 class="sr-only m-0 select-none">ChatGPT said:</h4>
                <div data-chatgpt-search-unit-key="fallback-turn-0:1:assistant">Hey! What's up?</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
